<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Expenses">
<meta name="theme-color" content="#0f5c5c">
<link rel="manifest" href='data:application/manifest+json,{"name":"Trip Expenses","short_name":"Expenses","start_url":".","display":"standalone","background_color":"#eef1ee","theme_color":"#0f5c5c"}'>
<title>Trip Expenses</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1b2a2f;--mute:#5d6d70;--line:#d3dbd8;--acc:#0f5c5c;--accink:#fff;--warn:#b3341f}
@media(prefers-color-scheme:dark){:root{--bg:#121a1b;--card:#1a2527;--ink:#e6eeec;--mute:#93a6a4;--line:#2d3c3e;--acc:#4fb3a9;--accink:#08201e;--warn:#ff8a74}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,'Iowan Old Style',serif;margin:.2em 0 .5em}
h1{font-size:1.9rem}h2{font-size:1.2rem}
a{color:var(--acc)}
.card,.trip,.exp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button.del{background:transparent;color:var(--warn);border-color:transparent;padding:4px 8px;font-weight:500}
button:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.trip{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-decoration:none;color:var(--ink)}
.trip em{font-style:normal;color:var(--mute);text-align:right}.trip em.open{color:var(--acc)}
.code{font:600 .85rem ui-monospace,Menlo,monospace;border:1.5px solid var(--acc);color:var(--acc);padding:1px 8px;border-radius:4px;letter-spacing:.08em;display:inline-block}
.muted{color:var(--mute)}
.total{font:700 2rem Georgia,serif;margin:4px 0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cats span{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.85rem}
.exp{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.exp .amt{font-weight:700;text-align:right}
.exp .files{grid-column:1/-1;font-size:.85rem}
.exp .files a{margin-right:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:9}
.back{display:inline-block;margin-bottom:6px;text-decoration:none}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const CATS = ['Travel','Stay','Food','Transport','Fuel','Shopping','Other'];
const db = new Dexie('tripexp');
db.version(1).stores({ trips:'++id,code,status', expenses:'++id,tripId,date', files:'++id,tripId,expenseId' });

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n, c) => c + ' ' + (+n || 0).toFixed(2);
const today = () => new Date().toISOString().slice(0, 10);
const group = (rows, key) => rows.reduce((o, r) => (o[r[key]] = (o[r[key]] || 0) + r.amount, o), {});
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500); };

async function newTrip(name, currency) {
  const raw = name + Date.now() + crypto.randomUUID();
  const h = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(raw));
  const code = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 8).toUpperCase();
  return db.trips.add({ code, name, currency, status:'open', created: today() });
}

/* ---------- Home ---------- */
async function home() {
  const ts = await db.trips.reverse().toArray();
  const rows = await Promise.all(ts.map(async t => {
    const e = await db.expenses.where({ tripId: t.id }).toArray();
    return [t, e.reduce((s, x) => s + x.amount, 0), e.length];
  }));
  $('#app').innerHTML = `<h1>Trips</h1>
  <form id="nt" class="card">
    <div class="row"><label>Trip name<input name="name" required placeholder="Goa offsite"></label>
    <label style="max-width:110px">Currency<input name="cur" value="INR" maxlength="3" required></label></div>
    <button>Create trip</button>
  </form>
  ${rows.length ? '' : '<p class="muted">No trips yet. Create one above, then add receipts to it.</p>'}
  ${rows.map(([t, tot, n]) => `<a class="trip" href="#t${t.id}">
    <b>${esc(t.name)}</b><em class="${t.status}">${t.status}</em>
    <span class="code">${t.code}</span><span class="muted" style="text-align:right">${n} receipts, ${money(tot, t.currency)}</span></a>`).join('')}`;
  $('#nt').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    location.hash = 't' + await newTrip(f.get('name').trim(), f.get('cur').toUpperCase());
  };
}

/* ---------- Trip ---------- */
async function trip(id) {
  const t = await db.trips.get(id);
  if (!t) return home();
  const ex = (await db.expenses.where({ tripId: id }).toArray()).sort((a, b) => a.date.localeCompare(b.date));
  const fl = await db.files.where({ tripId: id }).toArray();
  const tot = ex.reduce((s, x) => s + x.amount, 0);
  const open = t.status === 'open';
  $('#app').innerHTML = `<a class="back" href="#">Back to trips</a>
  <h1>${esc(t.name)}</h1>
  <div class="card">
    <span class="code">${t.code}</span> <span class="muted">${open ? 'Open' : 'Closed'}</span>
    <div class="total">${money(tot, t.currency)}</div>
    <div class="cats">${Object.entries(group(ex, 'category')).map(([c, v]) => `<span>${esc(c)} ${v.toFixed(2)}</span>`).join('') || '<span class="muted">No expenses yet</span>'}</div>
  </div>
  <div class="bar">
    <button id="pdf">Download PDF</button>
    <button id="xls" class="ghost">Download Excel</button>
    <button id="tog" class="ghost">${open ? 'Close trip' : 'Reopen trip'}</button>
  </div>
  ${open ? `<form id="ef" class="card"><h2>Add expense</h2>
    <label>Receipt files (PDF or images, several allowed)
      <input type="file" name="files" multiple accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx"></label>
    <div class="row"><label>Merchant<input name="merchant" required></label>
      <label>Date<input type="date" name="date" value="${today()}" required></label></div>
    <div class="row"><label>Amount<input name="amount" type="number" step="0.01" min="0" inputmode="decimal" required></label>
      <label>Tax<input name="tax" type="number" step="0.01" min="0" inputmode="decimal"></label></div>
    <label>Category<select name="category">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
    <label>Notes<textarea name="notes" rows="2"></textarea></label>
    <button>Save expense</button></form>` : ''}
  <h2>Expenses</h2>
  ${ex.length ? '' : '<p class="muted">Nothing here yet. Add a receipt above.</p>'}
  ${ex.map(e => `<div class="exp"><div><b>${esc(e.merchant)}</b><div class="muted">${e.date}, ${esc(e.category)}${e.notes ? ', ' + esc(e.notes) : ''}</div></div>
    <div class="amt">${money(e.amount, t.currency)}${open ? `<br><button class="del" data-del="${e.id}">Delete</button>` : ''}</div>
    <div class="files">${fl.filter(f => f.expenseId === e.id).map(f => `<a target="_blank" href="${URL.createObjectURL(f.blob)}">${esc(f.name)}</a>`).join('')}</div></div>`).join('')}
  <div class="bar"><button id="dt" class="del">Delete this trip</button></div>`;

  if (open) $('#ef').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), files = [...e.target.files.files];
    const eid = await db.expenses.add({ tripId: id, merchant: f.get('merchant').trim(), date: f.get('date'),
      amount: +f.get('amount'), tax: +f.get('tax') || 0, category: f.get('category'), notes: f.get('notes').trim() });
    for (const x of files) await db.files.add({ tripId: id, expenseId: eid, name: x.name, type: x.type, blob: x });
    toast('Expense saved'); trip(id);
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this expense and its files?')) return;
    await db.files.where({ expenseId: +b.dataset.del }).delete();
    await db.expenses.delete(+b.dataset.del); trip(id);
  });
  $('#tog').onclick = async () => { await db.trips.update(id, { status: open ? 'closed' : 'open' }); trip(id); };
  $('#dt').onclick = async () => {
    if (!confirm('Delete this trip, all expenses and files? This cannot be undone.')) return;
    await db.files.where({ tripId: id }).delete(); await db.expenses.where({ tripId: id }).delete();
    await db.trips.delete(id); location.hash = '';
  };
  const run = (btn, fn) => btn.onclick = async () => {
    if (!ex.length) return toast('Add at least one expense first');
    btn.disabled = true; const old = btn.textContent; btn.textContent = 'Working...';
    try { await fn(); } catch (err) { console.error(err); toast('Export failed: ' + err.message); }
    btn.disabled = false; btn.textContent = old;
  };
  run($('#pdf'), async () => save(await buildPdf(t, ex, fl), `${t.name}-${t.code}.pdf`));
  run($('#xls'), async () => save(await buildExcel(t, ex), `${t.name}-${t.code}.xlsx`));
}

/* ---------- Exports ---------- */
async function toJpeg(blob) {
  const bmp = await createImageBitmap(blob), c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}

async function buildPdf(t, ex, fl) {
  const { PDFDocument: D, StandardFonts: S, rgb } = PDFLib;
  const out = await D.create(), f = await out.embedFont(S.Helvetica), b = await out.embedFont(S.HelveticaBold);
  const clean = s => String(s ?? '').replace(/[^\x20-\x7E]/g, '?');
  let pg = out.addPage([595, 842]), y = 800;
  const tx = (s, x, o = {}) => pg.drawText(clean(s), { x, y, size: o.s || 10, font: o.b ? b : f, color: rgb(.1, .15, .17) });
  const nl = (h = 16) => { y -= h; if (y < 50) { pg = out.addPage([595, 842]); y = 800; } };

  tx(t.name, 40, { s: 20, b: 1 }); nl(24);
  tx(`Trip code ${t.code}    Currency ${t.currency}    Expenses ${ex.length}`, 40); nl(22);
  tx('Total ' + money(ex.reduce((s, x) => s + x.amount, 0), t.currency), 40, { s: 14, b: 1 }); nl(28);
  tx('By category', 40, { b: 1 }); nl();
  for (const [c, v] of Object.entries(group(ex, 'category'))) { tx(c, 40); tx(money(v, t.currency), 200); nl(14); }
  nl(12);
  tx('Date', 40, { b: 1 }); tx('Merchant', 110, { b: 1 }); tx('Category', 300, { b: 1 }); tx('Amount', 420, { b: 1 }); nl(16);
  for (const e of ex) { tx(e.date, 40); tx(e.merchant.slice(0, 34), 110); tx(e.category, 300); tx(money(e.amount, t.currency), 420); nl(14); }

  const skipped = [];
  for (const e of ex) for (const x of fl.filter(z => z.expenseId === e.id)) {
    try {
      const bytes = await x.blob.arrayBuffer();
      if (x.type === 'application/pdf' || /\.pdf$/i.test(x.name)) {
        const src = await D.load(bytes);
        (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p));
      } else if (x.type.startsWith('image/')) {
        const img = /png/.test(x.type) ? await out.embedPng(bytes)
          : /jpe?g/.test(x.type) ? await out.embedJpg(bytes)
          : await out.embedJpg(await (await toJpeg(x.blob)).arrayBuffer());
        const p = out.addPage([595, 842]), s = Math.min(555 / img.width, 760 / img.height);
        p.drawImage(img, { x: 20, y: 800 - img.height * s, width: img.width * s, height: img.height * s });
        p.drawText(clean(`${e.date}   ${e.merchant}   ${money(e.amount, t.currency)}`), { x: 20, y: 815, size: 9, font: f });
      } else skipped.push(x.name);
    } catch (err) { skipped.push(x.name + ' (could not read)'); }
  }
  if (skipped.length) {
    pg = out.addPage([595, 842]); y = 800;
    tx('Attachments not merged (stored in the app)', 40, { b: 1, s: 12 }); nl(20);
    skipped.forEach(n => { tx(n, 40); nl(14); });
  }
  return new Blob([await out.save()], { type: 'application/pdf' });
}

async function buildExcel(t, ex) {
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Expenses');
  ws.columns = [
    { header:'Date', key:'date', width:12 }, { header:'Merchant', key:'merchant', width:26 },
    { header:'Category', key:'category', width:14 }, { header:'Amount', key:'amount', width:12 },
    { header:'Tax', key:'tax', width:10 }, { header:'Notes', key:'notes', width:32 }];
  ex.forEach(e => ws.addRow(e));
  ws.addRow({ merchant:'TOTAL', amount:{ formula:`SUM(D2:D${ex.length + 1})` }, tax:{ formula:`SUM(E2:E${ex.length + 1})` } });
  ws.getRow(1).font = { bold: true }; ws.getRow(ex.length + 2).font = { bold: true };
  ws.views = [{ state:'frozen', ySplit:1 }];
  const sheet = (name, label, key) => {
    const s = wb.addWorksheet(name);
    s.columns = [{ header: label, width: 18 }, { header: 'Total ' + t.currency, width: 16 }];
    Object.entries(group(ex, key)).sort().forEach(([k, v]) => s.addRow([k, v]));
    s.getRow(1).font = { bold: true };
  };
  sheet('By Category', 'Category', 'category');
  sheet('By Day', 'Date', 'date');
  sheet('By Merchant', 'Merchant', 'merchant');
  const info = wb.addWorksheet('Trip');
  info.addRows([['Trip', t.name], ['Code', t.code], ['Currency', t.currency], ['Status', t.status]]);
  info.getColumn(1).font = { bold: true }; info.getColumn(1).width = 12; info.getColumn(2).width = 28;
  return new Blob([await wb.xlsx.writeBuffer()], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

async function save(blob, name) {
  name = name.replace(/[\\/:*?"<>|]/g, '_');
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  toast('Downloaded ' + name);
}

/* ---------- Router ---------- */
const route = () => { const m = location.hash.match(/^#t(\d+)$/); m ? trip(+m[1]) : home(); window.scrollTo(0, 0); };
addEventListener('hashchange', route);
navigator.storage?.persist?.();
route();
</script>
</body>
</html>
