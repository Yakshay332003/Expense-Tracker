<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Expenses">
<meta name="theme-color" content="#0f5c5c">
<link rel="manifest" href='data:application/manifest+json,{"name":"Trip Expenses","short_name":"Expenses","start_url":".","display":"standalone","background_color":"#eef1ee","theme_color":"#0f5c5c"}'>
<title>Trip Expenses</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1b2a2f;--mute:#5d6d70;--line:#d3dbd8;--acc:#0f5c5c;--accink:#fff;--warn:#b3341f;--note:#fff4cc;--noteink:#5a4600}
@media(prefers-color-scheme:dark){:root{--bg:#121a1b;--card:#1a2527;--ink:#e6eeec;--mute:#93a6a4;--line:#2d3c3e;--acc:#4fb3a9;--accink:#08201e;--warn:#ff8a74;--note:#4a3f10;--noteink:#ffe8a3}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,'Iowan Old Style',serif;margin:.2em 0 .5em}
h1{font-size:1.9rem}h2{font-size:1.2rem}
a{color:var(--acc)}
.card,.trip,.exp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input[type=radio]{display:inline-block;width:auto;margin:0 6px 0 0}
input[readonly]{opacity:.75}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button.del{background:transparent;color:var(--warn);border-color:transparent;padding:4px 8px;font-weight:500}
button:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.trip{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-decoration:none;color:var(--ink)}
.trip em{font-style:normal;color:var(--mute);text-align:right}.trip em.open{color:var(--acc)}
.code{font:600 .85rem ui-monospace,Menlo,monospace;border:1.5px solid var(--acc);color:var(--acc);padding:1px 8px;border-radius:4px;letter-spacing:.08em;display:inline-block}
.muted{color:var(--mute)}.small{font-size:.85rem}
.total{font:700 2rem Georgia,serif;margin:4px 0}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cats span{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.85rem}
.exp{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.exp .amt{font-weight:700;text-align:right}
.exp .files{grid-column:1/-1;font-size:.85rem}
.exp .files a{margin-right:10px}
.note{background:var(--note);color:var(--noteink);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:.85rem;display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:9}
.back{display:inline-block;margin-bottom:6px;text-decoration:none}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const COMPANY = 'Piramal Pharma Solutions';
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const CATS = ['Travel','Lodging','Hotel Meals','Fuel','Visa','Entertainment','Equipment','Travel Insurance','Wifi charges','Parking','Tolls','Office Supplies','Event Booking'];
const FORM_ROW = {
  'Travel':'AIR/TRAIN','Lodging':'HOTEL STAY','Hotel Meals':'HOTEL MEALS','Fuel':'FUEL','Visa':'VISA',
  'Entertainment':'ENTERTAINMENT','Equipment':'OTHER/EVENT TICKET BOOKING','Travel Insurance':'TRAVEL INSURANCE',
  'Wifi charges':'WIFI CHARGES','Parking':'PARKING','Tolls':'TOLLS','Office Supplies':'OFFICE SUPPLIES',
  'Event Booking':'OTHER/EVENT TICKET BOOKING'
};
const FORM_ROWS = ['HOTEL STAY','HOTEL MEALS','AIR/TRAIN','RENTAL/TAXI','MILEAGE REIMBURSEMENT','NUMBER OF MILES','RATE PER MILE',
  'TOLLS','PARKING','ENTERTAINMENT','WIFI CHARGES','FUEL','VISA','OFFICE SUPPLIES','TRAVEL INSURANCE','OTHER/EVENT TICKET BOOKING'];
const NON_MONEY = ['NUMBER OF MILES','RATE PER MILE'];
const CURRENCIES = [['INR','Indian Rupee'],['USD','US Dollar'],['EUR','Euro'],['GBP','British Pound'],['AED','UAE Dirham'],['SGD','Singapore Dollar'],
  ['AUD','Australian Dollar'],['CAD','Canadian Dollar'],['JPY','Japanese Yen'],['CHF','Swiss Franc'],['CNY','Chinese Yuan'],['HKD','Hong Kong Dollar'],
  ['MYR','Malaysian Ringgit'],['THB','Thai Baht'],['SAR','Saudi Riyal'],['QAR','Qatari Riyal'],['KWD','Kuwaiti Dinar'],['OMR','Omani Rial'],
  ['BHD','Bahraini Dinar'],['ZAR','South African Rand'],['NZD','New Zealand Dollar'],['SEK','Swedish Krona'],['NOK','Norwegian Krone'],
  ['DKK','Danish Krone'],['KRW','South Korean Won'],['IDR','Indonesian Rupiah'],['PHP','Philippine Peso'],['VND','Vietnamese Dong'],
  ['LKR','Sri Lankan Rupee'],['BDT','Bangladeshi Taka'],['NPR','Nepalese Rupee'],['TRY','Turkish Lira'],['BRL','Brazilian Real'],['MXN','Mexican Peso'],
  ['PLN','Polish Zloty'],['CZK','Czech Koruna'],['HUF','Hungarian Forint'],['RUB','Russian Ruble'],['EGP','Egyptian Pound']];
const curOpts = sel => CURRENCIES.map(([c, n]) => `<option value="${c}"${c === sel ? ' selected' : ''}>${c} - ${n}</option>`).join('');
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const db = new Dexie('tripexp2');
db.version(1).stores({ trips:'++id,code,status', expenses:'++id,tripId,date,weekEnding', files:'++id,tripId,expenseId' });

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = (n, c) => c + ' ' + (+n || 0).toFixed(2);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const group = (rows, key) => rows.reduce((o, r) => (o[r[key]] = r2((o[r[key]] || 0) + r.base), o), {});
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4000); };

const parse = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const toIso = d => d.toISOString().slice(0, 10);
const dowOf = iso => parse(iso).getUTCDay();
const addDays = (iso, n) => { const d = parse(iso); d.setUTCDate(d.getUTCDate() + n); return toIso(d); };
const weekEnd = iso => addDays(iso, 6 - dowOf(iso));
const fmt = iso => { const d = parse(iso); return String(d.getUTCDate()).padStart(2, '0') + '-' + MON[d.getUTCMonth()] + '-' + d.getUTCFullYear(); };

async function liveRate(from, to) {
  if (from === to) return { rate: 1, date: today() };
  const r = await fetch(`https://open.er-api.com/v6/latest/${from}`);
  const j = await r.json();
  if (j.result !== 'success' || !j.rates?.[to]) throw new Error(`No live rate for ${from} to ${to}`);
  return { rate: j.rates[to], date: today() };
}

/* ---------- Receipt reading (PDF text / OCR) and detection ---------- */
async function pdfText(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let txt = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
    const p = await pdf.getPage(i), c = await p.getTextContent();
    txt += c.items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('') + '\n';
  }
  if (txt.replace(/\s/g, '').length > 30) return txt;
  // scanned PDF: render first page and OCR it
  const p = await pdf.getPage(1), vp = p.getViewport({ scale: 2 }), cv = document.createElement('canvas');
  cv.width = vp.width; cv.height = vp.height;
  await p.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  return (await Tesseract.recognize(cv, 'eng')).data.text;
}
async function receiptText(file) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return pdfText(file);
  if (file.type.startsWith('image/')) return (await Tesseract.recognize(file, 'eng')).data.text;
  return '';
}

const CAT_WORDS = [
  ['Lodging', /\b(hotel|room|lodg|resort|inn|stay|check[- ]?in|accommodation|airbnb)\b/i],
  ['Hotel Meals', /\b(restaurant|cafe|caf\u00e9|meal|food|dining|breakfast|lunch|dinner|biryani|pizza|swiggy|zomato|bar|kitchen)\b/i],
  ['Travel', /\b(flight|airline|air india|indigo|vistara|boarding|train|irctc|railway|uber|ola|taxi|cab|bus|ticket|pnr)\b/i],
  ['Fuel', /\b(petrol|diesel|fuel|hpcl|bpcl|iocl|indian oil|shell)\b/i],
  ['Visa', /\bvisa\b/i],
  ['Travel Insurance', /\binsurance\b/i],
  ['Wifi charges', /\b(wi-?fi|internet|data pack)\b/i],
  ['Parking', /\bparking\b/i],
  ['Tolls', /\b(toll|fastag)\b/i],
  ['Office Supplies', /\b(stationery|office suppl|printing|xerox|courier)\b/i],
  ['Event Booking', /\b(conference|event|registration|exhibition|expo)\b/i],
  ['Entertainment', /\b(entertainment|movie|show|club|theatre)\b/i],
  ['Equipment', /\b(equipment|laptop|charger|adapter)\b/i]
];
function detect(text) {
  const out = {}, t = text.replace(/\r/g, '');
  const lines = t.split('\n').map(s => s.trim()).filter(Boolean);

  // currency: explicit code first, then symbols
  const codes = CURRENCIES.map(c => c[0]);
  const hit = t.match(new RegExp('\\b(' + codes.join('|') + ')\\b'));
  if (hit) out.currency = hit[1];
  else if (/\u20B9|\bRs\.?\s?\d|\bINR\b/i.test(t)) out.currency = 'INR';
  else if (/\u20AC/.test(t)) out.currency = 'EUR';
  else if (/\u00A3/.test(t)) out.currency = 'GBP';
  else if (/US\$|\$/.test(t)) out.currency = 'USD';

  // amount: largest number on a "total / amount due" style line
  const num = /\d{1,3}(?:,\d{2,3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g;
  let best = 0;
  for (const l of lines) if (/(grand\s*total|total\s*(amount|due|payable)?|amount\s*(due|payable|paid)|net\s*(amount|payable)|balance\s*due|bill\s*amount)/i.test(l) && !/sub\s*-?total|tax|gst|vat/i.test(l))
    for (const m of l.match(num) || []) { const v = parseFloat(m.replace(/,/g, '')); if (v > best && v < 1e8) best = v; }
  if (best) out.amount = r2(best);

  // date (day-first for numeric formats)
  const mi = s => MON.findIndex(m => m.toLowerCase() === s.slice(0, 3).toLowerCase());
  const ok = (y, m, d) => { if (y < 100) y += 2000; const dt = new Date(Date.UTC(y, m, d)); return y > 2000 && y < 2100 && dt.getUTCMonth() === m && dt.getUTCDate() === d ? toIso(dt) : null; };
  let m;
  if ((m = t.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/))) out.date = ok(+m[1], m[2] - 1, +m[3]);
  if (!out.date && (m = t.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/))) out.date = ok(+m[3], m[2] - 1, +m[1]);
  if (!out.date && (m = t.match(/\b(\d{1,2})(?:st|nd|rd|th)?[\s-]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[\s,.-]+(\d{2,4})\b/i))) out.date = ok(+m[3], mi(m[2]), +m[1]);
  if (!out.date && (m = t.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/i))) out.date = ok(+m[3], mi(m[1]), +m[2]);
  if (!out.date) delete out.date;

  // category by keywords (first match in priority order)
  for (const [c, re] of CAT_WORDS) if (re.test(t)) { out.category = c; break; }

  // details: merchant line + invoice number if present
  const name = lines.find(l => (l.match(/[A-Za-z]/g) || []).length >= 4 && !/^(tax invoice|invoice|receipt|bill|gst|date|page)/i.test(l));
  const inv = t.match(/(?:invoice|bill|receipt|ref)\s*(?:no\.?|number|#)?\s*[:#-]?\s*([A-Z0-9][A-Z0-9\/-]{3,})/i);
  if (name) out.details = name.replace(/\s+/g, ' ').slice(0, 70) + (inv ? ' - Inv ' + inv[1] : '');
  return out;
}

/* ---------- Home ---------- */
async function home() {
  const ts = await db.trips.reverse().toArray();
  const last = ts[0] || {};
  const rows = await Promise.all(ts.map(async t => {
    const e = await db.expenses.where({ tripId: t.id }).toArray();
    return [t, e.reduce((s, x) => s + x.base, 0), e.length];
  }));
  $('#app').innerHTML = `<h1>Trips</h1>
  <p class="muted small" style="margin-top:-6px">${COMPANY}</p>
  <form id="nt" class="card">
    <label>Trip Hashcode<input name="code" required pattern="[A-Za-z0-9_\\-]{3,32}" placeholder="e.g. A1B2C3D4" autocapitalize="off" autocomplete="off"></label>
    <label>Employee name<input name="emp" required value="${esc(last.employee)}"></label>
    <div class="row"><label>Cost center<input name="cc" required value="${esc(last.costCenter)}"></label>
    <label>Report currency<select name="cur">${curOpts(last.currency || 'INR')}</select></label></div>
    <button>Start trip</button>
  </form>
  ${rows.length ? '' : '<p class="muted">No trips yet. Enter a Hashcode above to start one.</p>'}
  ${rows.map(([t, tot, n]) => `<a class="trip" href="#t${t.id}">
    <span class="code">${esc(t.code)}</span><em class="${t.status}">${t.status}</em>
    <span class="muted small">${esc(t.employee)}</span><span class="muted" style="text-align:right">${n} expenses, ${money(tot, t.currency)}</span></a>`).join('')}`;
  $('#nt').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), code = f.get('code').trim();
    const all = await db.trips.toArray();
    if (all.some(t => t.code.toLowerCase() === code.toLowerCase())) return toast('This Hashcode already exists. Enter a different one.');
    if (!confirm(`Start a trip with Hashcode "${code}"?`)) return;
    const id = await db.trips.add({ code, currency: f.get('cur'), company: COMPANY, employee: f.get('emp').trim(),
      costCenter: f.get('cc').trim(), status: 'open', created: today() });
    location.hash = 't' + id;
  };
}

/* ---------- Trip ---------- */
async function trip(id) {
  const t = await db.trips.get(id);
  if (!t) return home();
  const ex = (await db.expenses.where({ tripId: id }).toArray()).sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  const fl = await db.files.where({ tripId: id }).toArray();
  const tot = r2(ex.reduce((s, x) => s + x.base, 0));
  const open = t.status === 'open';
  const weeks = [...new Set(ex.map(e => e.weekEnding))].sort();
  $('#app').innerHTML = `<a class="back" href="#">Back to trips</a>
  <h1>${esc(t.code)}</h1>
  <div class="card">
    <span class="muted">${open ? 'Open' : 'Closed'} &middot; ${esc(t.employee)} &middot; ${COMPANY}</span>
    <div class="total">${money(tot, t.currency)}</div>
    <div class="cats">${Object.entries(group(ex, 'category')).map(([c, v]) => `<span>${esc(c)} ${v.toFixed(2)}</span>`).join('') || '<span class="muted">No expenses yet</span>'}</div>
    ${weeks.length ? `<div class="muted small" style="margin-top:8px">Weeks ending: ${weeks.map(fmt).join(', ')}</div>` : ''}
  </div>
  <div class="bar">
    ${weeks.length > 1 ? `<select id="wk" style="width:auto;margin:0"><option value="all">All weeks (one sheet each)</option>${weeks.map(w => `<option value="${w}">Week ending ${fmt(w)}</option>`).join('')}</select>` : ''}
    <button id="xls">Download Excel</button>
    <button id="pdf" class="ghost">Download PDF</button>
    <button id="tog" class="ghost">${open ? 'Mark trip closed' : 'Reopen trip'}</button>
  </div>
  ${open ? `<form id="ef" class="card"><h2>Add expense</h2>
    <label>Receipt files (PDF or image; details are auto-detected from the first file)
      <input type="file" name="files" multiple accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx"></label>
    <div id="det" class="note"></div>
    <label>Expense date<input type="date" name="date" value="${today()}" required></label>
    <div id="wkinfo" class="muted small" style="margin:-4px 0 10px"></div>
    <label>Place of travel<input name="place" required></label>
    <div class="row"><label>Amount<input name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
      <label>Currency<select name="cur">${curOpts(t.currency)}</select></label></div>
    <div id="fx" class="card" style="display:none;background:var(--bg)">
      <label style="color:var(--ink)"><input type="radio" name="mode" value="live" checked>Fetch live rate</label>
      <label style="color:var(--ink)"><input type="radio" name="mode" value="manual">Enter rate manually</label>
      <label><span id="fxl"></span><input name="rate" type="number" step="any" min="0" inputmode="decimal" readonly></label>
      <button type="button" class="ghost" id="gr">Get live rate</button>
      <div id="conv" class="muted small" style="margin-top:8px"></div>
    </div>
    <label>Category<select name="category">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
    <label>Expense details<textarea name="details" rows="2" required></textarea></label>
    <button id="sv">Save expense</button></form>` : ''}
  <h2>Expenses</h2>
  ${ex.length ? '' : '<p class="muted">Nothing here yet.</p>'}
  ${ex.map(e => `<div class="exp"><div><b>${esc(e.details)}</b>
    <div class="muted small">${fmt(e.date)} (${e.day}) &middot; Week ending ${fmt(e.weekEnding)}<br>${esc(e.place)} &middot; ${esc(e.category)}</div></div>
    <div class="amt">${money(e.base, t.currency)}${e.currency !== t.currency ? `<div class="muted small" style="font-weight:400">${money(e.amount, e.currency)} @ ${e.rate} (${e.rateSource})</div>` : ''}
    ${open ? `<button class="del" data-del="${e.id}">Delete</button>` : ''}</div>
    <div class="files">${fl.filter(f => f.expenseId === e.id).map(f => `<a target="_blank" href="${URL.createObjectURL(f.blob)}" title="${esc(f.path)}">${esc(f.name)}</a>`).join('')}</div></div>`).join('')}
  <div class="bar"><button id="dt" class="del">Delete this trip</button></div>`;

  if (open) {
    const F = $('#ef'), rateMode = () => F.mode.value;
    const upd = () => {
      if (F.date.value) $('#wkinfo').textContent = `${DAYS[dowOf(F.date.value)]}, week ending ${fmt(weekEnd(F.date.value))}`;
      const cur = F.cur.value, diff = cur !== t.currency;
      $('#fx').style.display = diff ? 'block' : 'none';
      if (!diff) return;
      const live = rateMode() === 'live';
      F.rate.readOnly = live; $('#gr').style.display = live ? '' : 'none';
      $('#fxl').textContent = `Rate: 1 ${cur} = ? ${t.currency}`;
      const v = r2((+F.amount.value || 0) * (+F.rate.value || 0));
      $('#conv').textContent = F.rate.value ? `${F.amount.value || 0} ${cur} = ${v.toFixed(2)} ${t.currency}` : (live ? 'Tap "Get live rate" (or it is fetched on save).' : 'Enter the rate you want to use.');
    };
    const curChanged = e => { if (e.target.name === 'cur' && rateMode() === 'live') F.rate.value = ''; upd(); };
    F.addEventListener('input', curChanged);
    F.addEventListener('change', e => {
      if (e.target.name === 'mode') F.rate.value = '';
      else curChanged(e);
      if (e.target.name === 'files') autofill();
    });
    $('#gr').onclick = async () => {
      try { const r = await liveRate(F.cur.value, t.currency); F.rate.value = r.rate; F.dataset.rd = r.date; upd(); }
      catch (err) { toast(err.message + '. Check connection, or switch to manual.'); }
    };

    async function autofill() {
      const file = F.files.files[0], note = $('#det');
      if (!file) { note.style.display = 'none'; return; }
      note.style.display = 'block'; note.textContent = 'Reading receipt...';
      try {
        const d = detect(await receiptText(file)), got = [];
        if (d.date) { F.date.value = d.date; got.push('date'); }
        if (d.amount) { F.amount.value = d.amount; got.push('amount'); }
        if (d.currency) { F.cur.value = d.currency; F.rate.value = ''; got.push('currency'); }
        if (d.category && CATS.includes(d.category)) { F.category.value = d.category; got.push('category'); }
        if (d.details) { F.details.value = d.details; got.push('details'); }
        upd();
        note.textContent = got.length
          ? 'Auto-detected: ' + got.join(', ') + '. Please check them against the receipt. Place of travel must be entered by you.'
          : 'Could not read details from this file. Please fill the fields manually.';
      } catch (err) {
        console.error(err);
        note.textContent = 'Could not read this file (needs internet for the reader). Please fill the fields manually.';
      }
    }
    upd();

    F.onsubmit = async e => {
      e.preventDefault();
      const cur = F.cur.value, amount = +F.amount.value;
      let rate = 1, rateSource = 'same', rateDate = today();
      if (cur !== t.currency) {
        if (rateMode() === 'live') {
          rateSource = 'live';
          if (F.rate.value) { rate = +F.rate.value; rateDate = F.dataset.rd || today(); }
          else try { const r = await liveRate(cur, t.currency); rate = r.rate; rateDate = r.date; }
          catch (err) { return toast(err.message + '. Switch to manual entry.'); }
        } else {
          rate = +F.rate.value; rateSource = 'manual';
          if (!(rate > 0)) return toast('Enter a valid rate');
        }
      }
      $('#sv').disabled = true;
      const date = F.date.value, files = [...F.files.files];
      const eid = await db.expenses.add({ tripId: id, date, day: DAYS[dowOf(date)], weekEnding: weekEnd(date),
        place: F.place.value.trim(), amount, currency: cur, rate, rateSource, rateDate, base: r2(amount * rate),
        category: F.category.value, details: F.details.value.trim(), submittedBy: t.employee, logged: today() });
      for (const x of files) await db.files.add({ tripId: id, expenseId: eid, name: x.name, type: x.type,
        path: `Expenses/${t.code}/${x.name}`, blob: x });
      toast('Expense saved'); trip(id);
    };
  }
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this expense and its files?')) return;
    await db.files.where({ expenseId: +b.dataset.del }).delete();
    await db.expenses.delete(+b.dataset.del); trip(id);
  });
  $('#tog').onclick = async () => { await db.trips.update(id, { status: open ? 'closed' : 'open' }); trip(id); };
  $('#dt').onclick = async () => {
    if (!confirm('Delete this trip, all expenses and files? This cannot be undone.')) return;
    await db.files.where({ tripId: id }).delete(); await db.expenses.where({ tripId: id }).delete();
    await db.trips.delete(id); location.hash = '';
  };
  const run = (btn, fn) => btn.onclick = async () => {
    if (!ex.length) return toast('Add at least one expense first');
    btn.disabled = true; const old = btn.textContent; btn.textContent = 'Working...';
    try { await fn(); } catch (err) { console.error(err); toast('Export failed: ' + err.message); }
    btn.disabled = false; btn.textContent = old;
  };
  run($('#xls'), async () => {
    const sel = $('#wk')?.value || 'all';
    save(await buildExcel(t, ex, sel === 'all' ? weeks : [sel]), `Expense-Report-${t.code}.xlsx`);
  });
  run($('#pdf'), async () => save(await buildPdf(t, ex, fl), `Expenses-${t.code}.pdf`));
}

/* ---------- Excel (one reimbursement-form worksheet per Week Ending Date) ---------- */
async function buildExcel(t, ex, weeks) {
  const wb = new ExcelJS.Workbook();
  weeks.forEach(we => weekSheet(wb, t, ex.filter(e => e.weekEnding === we).sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id), we));
  return new Blob([await wb.xlsx.writeBuffer()], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function weekSheet(wb, t, rows, we) {
  const ws = wb.addWorksheet('Week Ending ' + fmt(we));
  ws.views = [{ showGridLines: false }];
  ws.pageSetup = { paperSize: 1, orientation: 'portrait', horizontalCentered: true, fitToPage: true, fitToWidth: 1, fitToHeight: 0,
    margins: { left: .5, right: .5, top: .5, bottom: .5, header: .3, footer: .3 } };
  [26, 12.5, 12.5, 12.5, 12.5, 12.5, 12.5, 12.5, 15].forEach((w, i) => ws.getColumn(i + 1).width = w);

  const NF = `"${t.currency}" #,##0.00`, DF = 'dd-mmm-yyyy';
  const GRAY = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFD9D9D9' } };
  const thin = { style:'thin' }, med = { style:'medium' };
  const L = c => String.fromCharCode(64 + c);
  const put = (r, c, v, o = {}) => {
    const x = ws.getCell(r, c); x.value = v;
    x.font = { name:'Calibri', size:o.sz || 11, bold:!!o.b };
    x.alignment = { horizontal:o.h || 'left', vertical:'middle', wrapText:!!o.wrap };
    if (o.nf) x.numFmt = o.nf; if (o.gray) x.fill = GRAY; return x;
  };
  const merge = (r, c1, c2) => c2 > c1 && ws.mergeCells(r, c1, r, c2);
  const grid = (r1, r2) => { for (let r = r1; r <= r2; r++) for (let c = 1; c <= 9; c++) ws.getCell(r, c).border = { top:thin, left:thin, bottom:thin, right:thin }; };
  const box = (r1, r2) => {
    const add = (r, c, k) => { const x = ws.getCell(r, c); x.border = { ...x.border, [k]: med }; };
    for (let c = 1; c <= 9; c++) { add(r1, c, 'top'); add(r2, c, 'bottom'); }
    for (let r = r1; r <= r2; r++) { add(r, 1, 'left'); add(r, 9, 'right'); }
  };
  const section = (r, title) => { merge(r, 1, 9); for (let c = 1; c <= 9; c++) ws.getCell(r, c).fill = GRAY; put(r, 1, title, { b:true, gray:true }); };
  const dayHeads = (r, first) => {
    put(r, 1, first, { b:true, h:'center', gray:true });
    DAYS.forEach((d, i) => put(r, i + 2, d, { b:true, h:'center', gray:true }));
    put(r, 9, 'TOTAL', { b:true, h:'center', gray:true });
  };

  const dates = rows.map(e => e.date), places = [...new Set(rows.map(e => e.place))];
  const start = addDays(we, -6);

  merge(1, 1, 9); put(1, 1, COMPANY, { b:true, h:'center' });
  merge(2, 1, 9); put(2, 1, 'Expense Report', { b:true, h:'center', sz:14 });
  const info = (r, l1, v1, l2, v2, o1 = {}) => {
    put(r, 1, l1, { b:true, wrap:true }); merge(r, 2, 4); put(r, 2, v1, o1);
    put(r, 5, l2, { b:true, wrap:true }); merge(r, 6, 9); put(r, 6, v2, { wrap:true });
    ws.getRow(r).height = 30;
  };
  info(3, 'Employee Name', t.employee, 'Cost Center', t.costCenter);
  info(4, 'Week Ending Date', parse(we), 'Trip Hashcode', t.code, { nf:DF, h:'left' });
  info(5, 'Date(s) Of Travel', dates.length ? `${fmt(dates[0])} to ${fmt(dates[dates.length - 1])}` : '', 'Place(s) Of Travel', places.join(', '));
  ws.getRow(5).height = Math.max(30, Math.ceil(places.join(', ').length / 28) * 15);
  grid(3, 5); box(1, 5);

  const byDay = Array(7).fill(0);
  rows.forEach(e => byDay[dowOf(e.date)] = r2(byDay[dowOf(e.date)] + e.base));
  const grand = r2(byDay.reduce((a, b) => a + b, 0));
  section(7, 'WEEKLY SUMMARY'); dayHeads(8, '');
  put(9, 1, 'DATE', { b:true });
  for (let i = 0; i < 7; i++) put(9, i + 2, parse(addDays(start, i)), { nf:DF, h:'center' });
  put(10, 1, 'DAY TOTAL', { b:true });
  byDay.forEach((v, i) => { if (v) put(10, i + 2, v, { nf:NF, h:'right', b:true }); });
  if (grand) put(10, 9, { formula:'SUM(B10:H10)', result:grand }, { nf:NF, h:'right', b:true });
  grid(8, 10); box(7, 10);

  const mat = {}; FORM_ROWS.forEach(k => mat[k] = Array(7).fill(0));
  rows.forEach(e => { const k = FORM_ROW[e.category]; if (k) mat[k][dowOf(e.date)] = r2(mat[k][dowOf(e.date)] + e.base); });
  section(12, 'EXPENSE CATEGORY'); dayHeads(13, 'CATEGORY');
  let r = 14; const moneyRows = [];
  FORM_ROWS.forEach(k => {
    put(r, 1, k, { b:true });
    if (!NON_MONEY.includes(k)) moneyRows.push(r);
    let sum = 0;
    mat[k].forEach((v, i) => { if (v) { put(r, i + 2, v, { nf:NF, h:'right' }); sum = r2(sum + v); } });
    if (sum) put(r, 9, { formula:`SUM(B${r}:H${r})`, result:sum }, { nf:NF, h:'right', b:true });
    r++;
  });
  const sub = r, adv = r + 1, ded = r + 2, reim = r + 3;
  put(sub, 1, 'SUB TOTAL', { b:true });
  for (let i = 0; i < 7; i++) if (byDay[i]) put(sub, i + 2, { formula:`SUM(${moneyRows.map(x => L(i + 2) + x).join(',')})`, result:byDay[i] }, { nf:NF, h:'right', b:true });
  if (grand) put(sub, 9, { formula:`SUM(${moneyRows.map(x => 'I' + x).join(',')})`, result:grand }, { nf:NF, h:'right', b:true });
  put(adv, 1, 'LESS ADVANCES', { b:true }); put(adv, 9, null, { nf:NF, h:'right' });
  put(ded, 1, 'LESS DEDUCTIONS', { b:true }); put(ded, 9, null, { nf:NF, h:'right' });
  put(reim, 1, 'REIMBURSEMENT', { b:true });
  if (grand) put(reim, 9, { formula:`I${sub}-I${adv}-I${ded}`, result:grand }, { nf:NF, h:'right', b:true });
  grid(13, reim); box(12, reim);

  let d = reim + 2;
  section(d, 'DETAILED EXPENSES'); d++;
  const hd = (c1, c2, txt) => { merge(d, c1, c2); for (let c = c1; c <= c2; c++) ws.getCell(d, c).fill = GRAY; put(d, c1, txt, { b:true, h:'center', gray:true }); };
  hd(1, 1, 'DATE'); hd(2, 3, 'EXPENSE TYPE'); hd(4, 8, 'DETAILS'); hd(9, 9, 'TOTAL');
  const hdr = d; d++;
  const first = d;
  rows.forEach(e => {
    put(d, 1, parse(e.date), { nf:DF, h:'center' });
    merge(d, 2, 3); put(d, 2, e.category);
    const txt = `${e.details} (${e.place})` + (e.currency !== t.currency ? ` [${e.currency} ${e.amount.toFixed(2)} @ ${e.rate}]` : '');
    merge(d, 4, 8); put(d, 4, txt, { wrap:true });
    put(d, 9, e.base, { nf:NF, h:'right' });
    ws.getRow(d).height = Math.max(15, Math.ceil(txt.length / 52) * 15);
    d++;
  });
  merge(d, 1, 8); put(d, 1, 'TOTAL', { b:true, h:'right' });
  put(d, 9, { formula:`SUM(I${first}:I${d - 1})`, result:grand }, { nf:NF, h:'right', b:true });
  grid(hdr, d); box(hdr - 1, d);

  const s = d + 2;
  merge(s, 1, 4); put(s, 1, 'Signature: ______________________   Date: ____________');
  merge(s, 5, 9); put(s, 5, 'Approval: ______________________   Date: ____________');
  ws.getRow(s).height = 30;

  for (let rr = 1; rr <= s; rr++) for (let c = 1; c <= 9; c++) { const x = ws.getCell(rr, c); if (!x.font?.name) x.font = { name:'Calibri', size:11 }; }
}

/* ---------- PDF (summary + merged receipts) ---------- */
async function toJpeg(blob) {
  const bmp = await createImageBitmap(blob), c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}
async function buildPdf(t, ex, fl) {
  const { PDFDocument: D, StandardFonts: S, rgb } = PDFLib;
  const out = await D.create(), f = await out.embedFont(S.Helvetica), b = await out.embedFont(S.HelveticaBold);
  const clean = s => String(s ?? '').replace(/[^\x20-\x7E]/g, '?');
  let pg = out.addPage([595, 842]), y = 800;
  const tx = (s, x, o = {}) => pg.drawText(clean(s), { x, y, size: o.s || 10, font: o.b ? b : f, color: rgb(.1, .15, .17) });
  const nl = (h = 16) => { y -= h; if (y < 50) { pg = out.addPage([595, 842]); y = 800; } };

  tx(COMPANY, 40, { s: 12, b: 1 }); nl(22);
  tx('Trip ' + t.code, 40, { s: 20, b: 1 }); nl(22);
  tx(`${t.employee}   Cost center ${t.costCenter}   Currency ${t.currency}`, 40); nl(22);
  tx('Total ' + money(ex.reduce((s, x) => s + x.base, 0), t.currency), 40, { s: 14, b: 1 }); nl(26);
  tx('Date', 40, { b: 1 }); tx('Place', 105, { b: 1 }); tx('Category', 230, { b: 1 }); tx('Original', 330, { b: 1 }); tx('Amount', 450, { b: 1 }); nl(16);
  for (const e of ex) {
    tx(fmt(e.date), 40); tx(e.place.slice(0, 20), 105); tx(e.category, 230);
    tx(e.currency !== t.currency ? money(e.amount, e.currency) : '', 330); tx(money(e.base, t.currency), 450); nl(14);
  }
  const skipped = [];
  for (const e of ex) for (const x of fl.filter(z => z.expenseId === e.id)) {
    try {
      const bytes = await x.blob.arrayBuffer();
      if (x.type === 'application/pdf' || /\.pdf$/i.test(x.name)) {
        const src = await D.load(bytes);
        (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p));
      } else if (x.type.startsWith('image/')) {
        const img = /png/.test(x.type) ? await out.embedPng(bytes)
          : /jpe?g/.test(x.type) ? await out.embedJpg(bytes)
          : await out.embedJpg(await (await toJpeg(x.blob)).arrayBuffer());
        const p = out.addPage([595, 842]), s = Math.min(555 / img.width, 760 / img.height);
        p.drawImage(img, { x: 20, y: 800 - img.height * s, width: img.width * s, height: img.height * s });
        p.drawText(clean(`${fmt(e.date)}   ${e.place}   ${money(e.base, t.currency)}`), { x: 20, y: 815, size: 9, font: f });
      } else skipped.push(x.name);
    } catch (err) { skipped.push(x.name + ' (could not read)'); }
  }
  if (skipped.length) {
    pg = out.addPage([595, 842]); y = 800;
    tx('Attachments not merged (stored in the app)', 40, { b: 1, s: 12 }); nl(20);
    skipped.forEach(n => { tx(n, 40); nl(14); });
  }
  return new Blob([await out.save()], { type: 'application/pdf' });
}

async function save(blob, name) {
  name = name.replace(/[\\/:*?"<>|]/g, '_');
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  toast('Downloaded ' + name);
}

/* ---------- Router ---------- */
const route = () => { const m = location.hash.match(/^#t(\d+)$/); m ? trip(+m[1]) : home(); window.scrollTo(0, 0); };
addEventListener('hashchange', route);
navigator.storage?.persist?.();
route();
</script>
